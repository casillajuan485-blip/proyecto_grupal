<!DOCTYPE html>
<!--
  ATELIER: proyecto frontend de una tienda de ropa.
  index.html = estructura; css/styles.css = presentación; js/app.js = lógica y jQuery.
  js/pdf-report.js = diseño de reportes PDF; js/lib/ = bibliotecas externas; img/ = fotografías.
  Edita nuestros archivos comentados. Las bibliotecas .min.js se usan tal como se descargaron.
  Las rutas parten de este index.html, aunque las imágenes se inserten desde JavaScript.
  Esta copia no necesita .nojekyll para ejecutarse localmente.
  No se necesita una base de datos ni un servidor de aplicación.
  Hora automática del dispositivo; no es una hora de servidor certificada.
  Los colores que ves en VS Code son del editor. Los de la página están en styles.css.
  Recursos: jQuery 3.7.1 y jsPDF 3.0.3. Licencias MIT incluidas en js/lib/.
  Fotografías ilustrativas de images.unsplash.com; reemplazables por las de la tienda.
  Tipografías opcionales DM Sans y Manrope de Google Fonts; alternativa local Arial.
-->
<html lang="es">

    <meta name="color-scheme" content="dark light" />
    <title>ATELIER — Clothing Hub</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script defer src="js/lib/jquery.min.js"></script>
    <!-- jsPDF genera archivos PDF directamente en el navegador. La biblioteca se incluye localmente. -->
    <script defer src="js/lib/jspdf.umd.min.js"></script>
    <script defer src="js/pdf-report.js"></script>
    <!-- Validaciones y formularios guiados: se cargan antes de la lógica de la tienda. -->
    <script defer src="js/validaciones.js"></script>
    <script defer src="js/app.js"></script>
  </head>

    <!-- AYUDA OPERATIVA: explica el administrador con un ejemplo, sin documentación externa. -->
    <template id="tpl-guia-admin">
      <p class="admin-guide-intro">
        El administrador es la vista del dueño: organiza las prendas, atiende pedidos y revisa lo
        que ocurrió en la tienda.
      </p>
      <ol class="admin-guide-steps">
        <li>
          <strong>Inventario: prepara lo que vendes.</strong>
          <p>
            Crea o edita prendas y precios. En Stock, una Entrada suma unidades y un Ajuste
            establece la cantidad final contada.
          </p>
        </li>
        <li>
          <strong>Ventas y pedidos: atiende las compras.</strong>
          <p>
            Los pedidos del cliente aparecen en Historial como Pendiente. Cámbialos a Confirmado y
            después a Entregado. También puedes preparar una venta presencial desde el catálogo y el
            carrito.
          </p>
        </li>
        <li>
          <strong>Eventos: consulta el registro automático.</strong>
          <p>
            Cada venta, movimiento, devolución o cambio de estado agrega un evento con fecha y hora.
            El botón de simulación añade 200 registros de prueba identificados como DEMO.
          </p>
        </li>
        <li>
          <strong>Reportes: revisa y protege la información.</strong>
          <p>
            Ventas permite descargar PDF y CSV; Inventario muestra existencias y stock bajo;
            Respaldo permite exportar o restaurar la copia JSON.
          </p>
        </li>
      </ol>
      <div class="notice">
        <strong>Ejemplo:</strong>
        tienes 10 camisetas y un cliente confirma un pedido de 2. Quedan 8 disponibles. Confirmar o
        entregar ese pedido no vuelve a descontarlas. Si lo cancelas, vuelven a quedar 10.
      </div>
      <p class="admin-guide-note">
        Cliente y Administrar son vistas de demostración del mismo navegador. El pago es al recoger;
        no se procesa un cobro en línea.
      </p>
    </template>
